<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chennai Road Twin</title>
<link rel="icon" href="../viper_eye.png">
<meta name="description" content="Viper Vision's city twin: every approved road hazard from Viper Vision and the BuildX app on one live map.">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
<style>
  :root { --bg:#05070d; --panel:#0d1220; --line:#1f2a44; --text:#e8eefc; --muted:#8c9abb; --blue:#3aa0ff; --amber:#ffb020; --green:#25d17a; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding:12px 16px 6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  header img { width:30px; height:30px; border-radius:50%; background:#fff; }
  header h1 { margin:0; font-size:19px; }
  header .sub { color:var(--muted); font-size:12.5px; width:100%; }
  body.embed header { display:none; }
  .stats { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; padding:6px 16px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .stat b { display:block; font-size:20px; } .stat span { color:var(--muted); font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:6px 16px; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:999px; padding:4px 10px; font:inherit; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .chip i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .chip.off { opacity:.4; }
  .tools { display:flex; gap:12px; padding:2px 16px 8px; color:var(--muted); font-size:12.5px; align-items:center; flex-wrap:wrap; }
  .tools label { display:flex; gap:5px; align-items:center; cursor:pointer; }
  #map { height:min(62vh, 560px); margin:0 16px; border-radius:12px; border:1px solid var(--line); background:#0b0f19; }
  body.embed #map { height:440px; }
  h2 { font-size:15px; margin:14px 16px 6px; }
  .list { padding:0 16px 16px; display:grid; gap:8px; }
  .card { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12.5px; border:1px dashed var(--amber); border-radius:8px; padding:8px 10px; background:var(--panel); overflow-wrap:anywhere; }
  .card b { color:var(--amber); } .card.wait { border-color:var(--muted); opacity:.85; } .card.wait b { color:var(--muted); }
  .card .meta { font-family:system-ui, sans-serif; color:var(--muted); font-size:11.5px; margin-top:4px; }
  .ride-go { margin:4px 16px 10px; width:calc(100% - 32px); padding:14px; border-radius:12px; border:0; background:#2563eb; color:#fff; font:inherit; font-size:16px; font-weight:700; cursor:pointer; }
  body.embed .ride-go { display:none; }
  .ride { margin:0 16px 10px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .ride-top { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .ride-top button { border:1px solid var(--line); background:transparent; color:var(--text); border-radius:8px; padding:5px 12px; font:inherit; cursor:pointer; }
  .warn { margin-top:8px; background:#3b1d06; border:2px solid var(--amber); border-radius:10px; padding:12px; font-size:20px; font-weight:700; color:#ffd58a; }
  .warn .meta { font-size:12.5px; font-weight:400; color:var(--muted); margin-top:4px; font-family:ui-monospace, Menlo, Consolas, monospace; }
  .msg { padding:8px 16px; color:var(--muted); font-size:12.5px; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:var(--panel); color:var(--text); }
  .leaflet-popup-content { margin:10px 12px; font-size:12.5px; }
  .leaflet-container a.leaflet-popup-close-button { color:var(--muted); }
  @media (max-width:520px) { .ride, .ride-go { margin-left:8px; margin-right:8px; } .ride-go { width:calc(100% - 16px); } .stats { grid-template-columns:repeat(2, minmax(0,1fr)); } #map { margin:0 8px; } .stats, .chips, .tools, .list, .msg { padding-left:8px; padding-right:8px; } }
</style>
</head>
<body>
<header>
  <img src="../viper_eye.png" alt="">
  <h1>Chennai road twin</h1>
  <div class="sub">Every approved road hazard from Viper Vision and the BuildX app, on one live map. Updates every 30 s. On a phone, Start ride warns you before you reach one.</div>
</header>
<div class="stats">
  <div class="stat"><b id="n-ok">–</b><span>approved reports</span></div>
  <div class="stat"><b id="n-j">–</b><span>junctions with hazards</span></div>
  <div class="stat"><b id="n-wait">–</b><span>waiting for approval</span></div>
  <div class="stat"><b id="n-t">–</b><span>last update</span></div>
</div>
<div class="chips" id="chips"></div>
<div class="tools">
  <label><input type="checkbox" id="show-wait"> Show reports waiting for approval</label>
  <label>Source <select id="src"><option value="">All</option><option value="Viper">Viper Vision</option><option value="BuildX">BuildX app</option></select></label>
</div>
<button class="ride-go" id="ride-btn">▶ Start ride: warn me before hazards on my way</button>
<div class="ride" id="ride" hidden>
  <div class="ride-top"><b id="ride-state">Finding your location…</b><button id="ride-stop">Stop</button></div>
  <div class="warn" id="ride-warn" hidden></div>
</div>
<div id="map"></div>
<div class="msg" id="msg"></div>
<h2>Latest reports</h2>
<div class="list" id="list"></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const DB = Q.get('db') || 'https://nyltxpazwlfnqddqhkiz.supabase.co';
const KEY = Q.get('key') || 'sb_publishable_M2u9ViG4BliELbZV2VpilA_FyEHofCU';
if (Q.has('embed')) document.body.classList.add('embed');

// kinds of hazard, by keywords in the report text
const KINDS = [
  ['pothole', 'Pothole', '#f97316', /pothole/],
  ['damage', 'Road damage / crack', '#ef4444', /damage|crack|broken road|uneven|manhole|debris/],
  ['breaker', 'Speed breaker', '#eab308', /speed breaker|breaker|hump/],
  ['signal', 'No traffic light', '#3b82f6', /traffic light|signal/],
  ['light', 'Poor lighting', '#a78bfa', /lighting|dark|lamp|street ?light|no light/],
  ['speed', 'Fast traffic', '#f43f5e', /fast|speeding|overspeed|speed control/],
  ['crossing', 'Unsafe crossing', '#22d3ee', /zebra|crossing|pedestrian|footpath/],
  ['lane', 'Squeezing / lanes', '#10b981', /squeez|lane|weav/],
  ['crash', 'Accident / close calls', '#dc2626', /accident|crash|collision|close call|near.?miss|hard brak/],
];
const OTHER = ['other', 'Other', '#94a3b8'];
function kindsOf(text) {
  const t = String(text || '').toLowerCase(), out = new Map();
  for (const part of t.split(/[;,|]+/)) {
    const p = part.trim(); if (!p) continue;
    const m = p.match(/\((\d+)\)/), n = m ? +m[1] : 1;
    const k = KINDS.find(k => k[3].test(p)) || OTHER;
    out.set(k[0], (out.get(k[0]) || 0) + n);
  }
  return out;
}
const kindById = Object.fromEntries([...KINDS, OTHER].map(k => [k[0], k]));
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (v) => { const d = new Date(v); return isNaN(d) ? '' : d.toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const card = (r) => `<div class="card ${r.status === 'pending' ? 'wait' : ''}"><div><b>JUNCTION COORDINATES:</b> ${(+r.lat).toFixed(5)}, ${(+r.lon).toFixed(5)}</div>`
  + `<div><b>HAZARD SPOTTED:</b> ${esc(r.hazard)}</div><div class="meta">${esc(r.source || '')} · ${r.status === 'pending' ? 'waiting for approval · sent ' + fmt(r.created_at) : 'approved ' + fmt(r.approved_at || r.created_at)}</div></div>`;

const map = L.map('map', { zoomControl: true, preferCanvas: true })
  .setView([+(Q.get('lat') || 13.0827), +(Q.get('lon') || 80.2707)], +(Q.get('z') || (Q.get('lat') ? 15 : 11)));
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
const street = L.tileLayer(ESRI + 'World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 20, maxNativeZoom: 19, attribution: 'Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors' }).addTo(map);
const satellite = L.tileLayer(ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 20, maxNativeZoom: 19, attribution: 'Tiles &copy; Esri, Maxar, Earthstar Geographics' });
L.control.layers({ Street: street, Satellite: satellite }, null, { position: 'topright', collapsed: false }).addTo(map);
const cluster = L.markerClusterGroup({ maxClusterRadius: 40, showCoverageOnHover: false });
map.addLayer(cluster);
if (Q.get('lat')) L.circle([+Q.get('lat'), +Q.get('lon')], { radius: 150, color: '#3aa0ff', weight: 1, fillOpacity: .06 }).addTo(map);

let rows = [], off = new Set();
const $ = (id) => document.getElementById(id);
$('show-wait').onchange = draw; $('src').onchange = draw;

async function get(params) {
  const r = await fetch(`${DB}/rest/v1/twin_hazards?${params}`, { headers: { apikey: KEY } });
  if (!r.ok) throw new Error(`database said ${r.status}`);
  return r.json();
}
async function load() {
  try {
    const [ok, wait] = await Promise.all([
      get('select=*&status=eq.approved&order=approved_at.desc&limit=2000'),
      get('select=*&status=eq.pending&order=created_at.desc&limit=200')]);
    rows = [...ok, ...wait];
    try { localStorage.setItem('twin_ok', JSON.stringify(ok)); } catch (e) {}
    $('n-ok').textContent = ok.length;
    $('n-wait').textContent = wait.length;
    $('n-j').textContent = new Set(ok.map(r => `${(+r.lat).toFixed(3)},${(+r.lon).toFixed(3)}`)).size;
    $('n-t').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    $('msg').textContent = '';
    draw();
  } catch (e) {
    if (!rows.length) { try { rows = JSON.parse(localStorage.getItem('twin_ok') || '[]'); draw(); } catch (e2) {} }
    $('msg').textContent = `Could not reach the twin's database (${e.message}). ${rows.length ? 'Showing the last saved copy. ' : ''}Retrying in 30 s.`;
  }
}
function visible() {
  const src = $('src').value, wait = $('show-wait').checked;
  return rows.filter(r => (r.status === 'approved' || (wait && r.status === 'pending')) && (!src || String(r.source || '').startsWith(src))
    && [...kindsOf(r.hazard).keys()].some(k => !off.has(k)));
}
function draw() {
  // chips: counts by kind over approved reports
  const tot = new Map();
  for (const r of rows) if (r.status === 'approved') for (const [k, n] of kindsOf(r.hazard)) tot.set(k, (tot.get(k) || 0) + n);
  $('chips').innerHTML = [...tot.entries()].sort((a, b) => b[1] - a[1]).map(([k, n]) =>
    `<button class="chip ${off.has(k) ? 'off' : ''}" data-k="${k}"><i style="background:${kindById[k][2]}"></i>${kindById[k][1]} · ${n}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { off.has(b.dataset.k) ? off.delete(b.dataset.k) : off.add(b.dataset.k); draw(); });
  cluster.clearLayers();
  const vis = visible();
  for (const r of vis) {
    const ks = [...kindsOf(r.hazard).entries()].sort((a, b) => b[1] - a[1]);
    const col = kindById[(ks[0] || ['other'])[0]][2], wait = r.status === 'pending';
    const m = L.circleMarker([+r.lat, +r.lon], { radius: 8, color: wait ? '#8c9abb' : '#fff', weight: wait ? 2 : 1.5,
      dashArray: wait ? '3 3' : null, fillColor: col, fillOpacity: wait ? .25 : .9 });
    m.bindPopup(card(r), { maxWidth: 300 });
    cluster.addLayer(m);
  }
  $('list').innerHTML = vis.slice(0, 15).map(card).join('') || '<div class="msg">No reports yet. Approve one in Viper Vision tab 4 (Permanent twin), or send one from the BuildX app.</div>';
}

// ---------------------------------------------------------------- ride mode: warn before known hazards (phone GPS)
const AHEAD_M = 300, SIDE_DEG = 35, NEAR_M = 120, RESET_M = 400;
const SAY = { pothole: 'Pothole', damage: 'Road damage', breaker: 'Speed breaker', signal: 'Junction with no traffic light',
  light: 'Dark stretch', speed: 'Fast traffic', crossing: 'Unsafe crossing', lane: 'Two-wheelers squeezing',
  crash: 'Collision risk', other: 'Hazard' };
const distM = (a1, o1, a2, o2) => Math.hypot((o2 - o1) * 111320 * Math.cos(a1 * Math.PI / 180), (a2 - a1) * 110540);
const bearing = (a1, o1, a2, o2) =>
  (Math.atan2((o2 - o1) * 111320 * Math.cos(a1 * Math.PI / 180), (a2 - a1) * 110540) * 180 / Math.PI + 360) % 360;
const words = (text) => [...kindsOf(text).entries()].sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k], i) => i ? SAY[k].toLowerCase() : SAY[k]).join(' and ');
function say(t) {
  try { const u = new SpeechSynthesisUtterance(t); u.lang = 'en-IN'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
let ride = null;
async function startRide() {
  if (!navigator.geolocation) { $('ride').hidden = false; $('ride-state').textContent = 'This browser cannot use GPS.'; return; }
  ride = { warned: new Set(), last: null, heading: null, me: null, follow: true, wake: null };
  $('ride').hidden = false; $('ride-btn').hidden = true; $('ride-warn').hidden = true;
  $('ride-state').textContent = 'Finding your location…';
  $('show-wait').checked = false; draw();
  say('Ride mode on');                          // the tap unlocks speech on phones
  try { ride.wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  ride.watch = navigator.geolocation.watchPosition(onFix, (e) => {
    if (ride) $('ride-state').textContent = `Location is off or blocked (${e.message}). Allow location for this page.`;
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}
function stopRide() {
  if (!ride) return;
  navigator.geolocation.clearWatch(ride.watch);
  try { ride.wake && ride.wake.release(); } catch (e) {}
  if (ride.me) map.removeLayer(ride.me);
  ride = null; $('ride').hidden = true; $('ride-btn').hidden = false;
}
function onFix(p) {
  if (!ride) return;
  const lat = p.coords.latitude, lon = p.coords.longitude, spd = p.coords.speed;
  if (Number.isFinite(p.coords.heading) && spd > 1.5) ride.heading = p.coords.heading;
  if (!ride.last) ride.last = [lat, lon];
  else if (distM(ride.last[0], ride.last[1], lat, lon) >= 10) {
    if (!(Number.isFinite(p.coords.heading) && spd > 1.5)) ride.heading = bearing(ride.last[0], ride.last[1], lat, lon);
    ride.last = [lat, lon];
  }
  if (!ride.me) ride.me = L.circleMarker([lat, lon], { radius: 9, color: '#fff', weight: 3, fillColor: '#3aa0ff', fillOpacity: 1 }).addTo(map);
  else ride.me.setLatLng([lat, lon]);
  if (ride.follow) map.setView([lat, lon], Math.max(map.getZoom(), 16));
  let best = null, fresh = null, n = 0;
  for (const r of rows) {
    if (r.status !== 'approved') continue;
    const d = distM(lat, lon, +r.lat, +r.lon);
    if (d <= 2000) n++;
    if (d > RESET_M) { ride.warned.delete(r.id); continue; }
    if (d > AHEAD_M) continue;
    // with a direction known: only hazards in front (or right on top); before the first move: anything close
    const ahead = ride.heading == null ? d <= NEAR_M
      : d <= 40 || Math.abs(((bearing(lat, lon, +r.lat, +r.lon) - ride.heading) + 540) % 360 - 180) <= SIDE_DEG;
    if (ahead && (!best || d < best.d)) best = { r, d };
    if (ahead && !ride.warned.has(r.id) && (!fresh || d < fresh.d)) fresh = { r, d };
  }
  const kmh = Number.isFinite(spd) && spd >= 0 ? ` · ${Math.round(spd * 3.6)} km/h` : '';
  $('ride-state').textContent = `Riding${kmh} · ${n} known hazard${n === 1 ? '' : 's'} within 2 km`;
  const w = $('ride-warn');
  const m10 = (d) => Math.max(10, Math.round(d / 10) * 10);
  if (!best) { w.hidden = true; return; }
  w.hidden = false;
  w.innerHTML = `⚠ ${esc(words(best.r.hazard))} ahead · ${m10(best.d)} m<div class="meta">${esc(best.r.hazard)}</div>`;
  if (fresh) {                                    // say each hazard once per approach, nearest new one first
    ride.warned.add(fresh.r.id);
    say(`${words(fresh.r.hazard)} ahead, ${m10(fresh.d)} metres`);
    try { navigator.vibrate && navigator.vibrate([250, 120, 250]); } catch (e) {}
  }
}
$('ride-btn').onclick = startRide;
$('ride-stop').onclick = stopRide;
map.on('dragstart', () => { if (ride) ride.follow = false; });

load();
setInterval(load, 30000);
</script>
</body>
</html>
